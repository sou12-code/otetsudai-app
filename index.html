<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お小遣い請求書</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            color: #333;
        }
        input, button {
            font-size: 16px;
            padding: 8px;
        }
        .summary-card {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .print-header {
            display: none;
        }

        /* PDF出力（印刷）時のスタイル設定 */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-header {
                display: block !important;
                border-bottom: 2px solid #333;
                margin-bottom: 20px;
                padding-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- PDF出力時に上部に表示されるタイトル -->
    <div class="print-header">
        <h1 style="margin: 0; font-size: 22px;">お小遣い請求書</h1>
        <p style="margin: 5px 0 0 0; font-size: 14px; color: #666;">手伝い時間記録</p>
    </div>

    <!-- 入力フォーム（PDF化の時は隠れます） -->
    <div class="no-print">
        <h1>手伝い時間記録アプリ</h1>
        <div>
            <label>やったこと: </label><br>
            <input type="text" id="work-name" placeholder="例: 掃除、勉強" style="width: 80%;">
        </div>
        <br>
        <div>
            <label>時間: </label><br>
            <input type="number" id="work-hours" value="0" min="0" style="width: 60px;"> 時間
            <input type="number" id="work-minutes" value="30" min="0" max="59" style="width: 60px;"> 分
        </div>
        <br>
        <button id="add-btn" style="background-color: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: bold;">記録を追加する</button>
        <hr>
    </div>

    <!-- 合計結果エリア -->
    <div class="summary-card">
        <h2 style="margin-top: 0; font-size: 16px;">合計結果</h2>
        <p style="font-size: 18px; margin: 0;">合計時間: <strong id="total-time" style="color: #0d6efd;">0時間 0分</strong></p>
    </div>

    <!-- 履歴リストエリア -->
    <h2>やったことの履歴</h2>
    <ul id="history-list" style="line-height: 1.8;">
        <!-- ここに履歴が追加されます -->
    </ul>

    <!-- 操作ボタン（PDF化の時は隠れます） -->
    <div class="no-print" style="margin-top: 30px;">
        <button id="print-btn" style="padding: 10px 20px; background-color: #198754; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold;">📄 PDFで保存する</button>
        <button id="reset-btn" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-left: 10px;">データをすべてリセット</button>
    </div>

    <!-- JavaScriptをHTMLの中に直接埋め込み -->
    <script>
        let records = JSON.parse(localStorage.getItem('workRecords')) || [];

        renderRecords();

        document.getElementById('add-btn').addEventListener('click', function() {
            let workName = document.getElementById('work-name').value;
            let hours = parseInt(document.getElementById('work-hours').value) || 0;
            let minutes = parseInt(document.getElementById('work-minutes').value) || 0;

            if (workName.trim() === "") {
                alert("やったことを入力してください！");
                return;
            }

            if (hours === 0 && minutes === 0) {
                alert("時間を入力してください！");
                return;
            }

            let totalMinutesInput = (hours * 60) + minutes;

            let today = new Date();
            let dateString = today.getFullYear() + '/' + 
                             String(today.getMonth() + 1).padStart(2, '0') + '/' + 
                             String(today.getDate()).padStart(2, '0');

            records.push({
                date: dateString,
                name: workName,
                minutes: totalMinutesInput
            });

            localStorage.setItem('workRecords', JSON.stringify(records));

            renderRecords();

            document.getElementById('work-name').value = "";
            document.getElementById('work-hours').value = "0";
            document.getElementById('work-minutes').value = "0";
        });

        function renderRecords() {
            let list = document.getElementById('history-list');
            list.innerHTML = "";

            let grandTotalMinutes = 0;

            records.forEach(function(item) {
                grandTotalMinutes += item.minutes;

                let h = Math.floor(item.minutes / 60);
                let m = item.minutes % 60;
                let timeText = "";
                if (h > 0) timeText += `${h}時間 `;
                if (m > 0 || h === 0) timeText += `${m}分`;

                let dateDisplay = item.date ? `[${item.date}] ` : "";

                let newItem = document.createElement('li');
                newItem.innerText = `${dateDisplay}${item.name} : ${timeText}`;
                list.appendChild(newItem);
            });

            let totalH = Math.floor(grandTotalMinutes / 60);
            let totalM = grandTotalMinutes % 60;

            document.getElementById('total-time').innerText = `${totalH}時間 ${totalM}分`;
        }

        // PDF保存ボタンの処理
        document.getElementById('print-btn').addEventListener('click', function() {
            window.print();
        });

        // リセットボタンの処理
        document.getElementById('reset-btn').addEventListener('click', function() {
            if (confirm("本当に記録をすべて消しますか？")) {
                localStorage.removeItem('workRecords');
                location.reload();
            }
        });
    </script>
</body>
</html>
